<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernow Surf School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"></head>
<body>
    <h1>Kernow Surf School - The Best Surfing in Cornwall</h1>

    <div class="row text-center">
        <div class="col-4">
            <div class="card">
                <div class="card-title">Group package</div>
                <div class="card-body">
                    <div class="card-text">£35 per person</div>
                    <div class="card-text">1-8 people</div>                    
                    <img class="rounded-circle img-fluid" src="surfer.jpg">
                </div>
            </div>
        </div>

        <div class="col-4">
            <div class="card">
                <div class="card-title">Private</div>
                <div class="card-body">
                    <div class="card-text">£65</div>
                    <div class="card-text">1-2 people</div>
                    <img class="rounded-circle img-fluid" src="surfer.jpg">
                </div>
            </div>
        </div>
        
        <div class="col-4">
            <div class="card">
                <div class="card-title">Family</div>
                <div class="card-body">
                    <div class="card-text">£30</div>
                    <div class="card-text">1-8 people</div>
                    <img class="rounded-circle img-fluid" src="surfer.jpg">
                </div>
            </div>
        </div>        
    </div>
</body>
</html>
